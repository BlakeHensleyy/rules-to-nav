name: Run Script Usage Tests

on: [push, pull_request, workflow_dispatch]

jobs: 
  platform-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [csv, elastic, sentinel, sigma, splunk, suricata]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run base script for each platform
      run: |
        python rules-to-nav.py --rules-directory rules --out-file ${{ matrix.platform }}-heatmap.json --rule-format ${{ matrix.platform }}

    - name: Compute hash of the result
      run: |
        md5sum ${{ matrix.platform }}-heatmap.json > result_hash_${{ matrix.platform }}.txt

    - name: Compare hash with expected result
      run: |
        diff result_hash_${{ matrix.platform }}.txt test-rules/test-results/expected_hash_${{ matrix.platform }}.txt

    feature-tests: